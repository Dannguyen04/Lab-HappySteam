<title>Robot đẩy xe · Lớp 3 · Bài 15 · Happy STEAM</title>
<template data-slot="header-copy">

      <h1>Robot đẩy xe</h1>
      <p class="lede pro-only">Lắp robot hai chân và xe hàng 27 bước với một động cơ M1. Lực đẩy từ hai chân đưa xe tiến về phía trước; chỉnh thời gian chạy và lệnh dừng để xe dừng đúng vạch đích.</p>
</template>

<template data-slot="mission-chips">
    <span class="chip" id="chip-m1" title="Hoàn thành 27 trang sách hướng dẫn lắp"><i>1</i>Lắp đủ 27 bước</span>
    <span class="chip" id="chip-m2" title="Start · Bắt đầu lặp · Quay nhanh · Lặp lại"><i>2</i>Đúng 4 khối mẫu</span>
    <span class="chip" id="chip-m3" title="Thêm khối Chờ và Dừng để xe dừng cách xuất phát 80 cm (sai số 5 cm)"><i>3</i>Dừng đúng vạch 80 cm</span>
    <span class="chip" id="chip-m4" title="Gắn đầu đẩy rộng, thanh chống, khung chặn hàng hoặc khay chở thùng rồi chạy"><i>4</i>Nâng cấp robot</span>
    <span class="chip pro-only" id="chip-m5" title="Mỗi lượt có vạch và tải khác nhau; chỉnh lại thời gian rồi chạy lại"><i>5</i>Giao đủ 3 lượt</span>
</template>

<template data-slot="victory-copy">
      <p>Em đã lắp robot đẩy xe, điều khiển xe dừng đúng vạch đích và thử cải tiến mô hình để chở hàng tốt hơn.</p>
      <p class="code-line">Mã tham chiếu: <code id="verify-code-output">ZM3-15</code></p>
</template>

</template>

          <p class="status-text">Sáng tạo cho robot đẩy xe: <b>đầu đẩy rộng</b> giữ xe thẳng, <b>thanh chống</b> hai bên xe nặng, <b>khung chặn hàng</b> phía sau và <b>khay chở thùng</b> có chốt giữ. Gắn từng phụ kiện lên mô hình 3D.</p>

          <p class="calc-eq" id="calc-eq2"></p>
        </div>
</template>
