      <h1>Robot tìm nguồn nước trên sao Hỏa</h1>
      <p class="lede pro-only">Nước cần thiết cho sự sống. Lắp robot 15 bước với động cơ và cảm biến siêu âm, lập trình chạy đến mỏm băng, dừng và bơm nước 3 giây. Nâng cấp bồn chứa hoặc máy bơm để thu đủ nước nhanh hơn.</p>
</template>

    <span class="chip" id="chip-m4" title="Chọn gói nâng cấp sáng tạo rồi chạy chương trình"><i>4</i>Chạy robot sáng tạo</span>

<template data-slot="creative-intro">
          <p class="status-text">Để tìm nước trên sao Hỏa, robot phải <b>phát hiện mỏm băng</b> và <b>dừng đủ lâu để bơm</b>. Thử nâng cấp <b>bồn chứa</b> (thêm 1 lít/mẫu), <b>máy bơm mạnh</b> (bơm nhanh gấp đôi), hoặc <b>pin mặt trời</b> (thiết kế sáng tạo). Chọn gói hoặc tự gắn chi tiết lên mô hình 3D.</p>
</template>
