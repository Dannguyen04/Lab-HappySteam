      <p class="lede pro-only">Tìm hiểu đòn bẩy và lực đàn hồi qua mô hình cơ khí 24 trang. Trên sa bàn học tập, thử thả bóng mềm ảo vào vòng đích và so sánh ba nấc lực mô phỏng.</p>

    <span class="chip" id="chip-m4" title="Gắn chi tiết ở xưởng rồi thả bóng một lượt"><i>4</i>Sáng tạo mô hình</span>
    <span class="chip pro-only" id="chip-m5" title="Đọc vị trí vòng đích ở từng lượt rồi chọn nấc thích hợp"><i>5</i>Thử ba vòng</span>

<template data-slot="victory-copy">
