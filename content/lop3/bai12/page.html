<template data-slot="header-copy">

      <h1>Robot trồng cây trên sao Hỏa</h1>
      <p class="lede pro-only">Lắp robot 31 bước với hai động cơ M1 (bánh xe), M2 (khung gắp) và cảm biến siêu âm. Phát hiện chậu non, gắp về luống trồng trong nhà kính sao Hỏa và xử lý bão bụi.</p>
</template>

    <span class="chip" id="chip-m3" title="Chỉnh thời gian lùi để chậu đứng đúng ô luống; đừng gắp khi quá xa"><i>3</i>Trồng ba cây</span>
    <span class="chip" id="chip-m4" title="Gắn khung gắp rộng, bình tưới, đèn chiếu hoặc pin mặt trời rồi chạy"><i>4</i>Nâng cấp robot</span>
    <span class="chip pro-only" id="chip-m5" title="Mỗi vòng có bão bụi, phải đợi đường trống mới di chuyển"><i>5</i>Tránh bão bụi</span>
