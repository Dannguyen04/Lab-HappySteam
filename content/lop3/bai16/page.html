<title>Xe chở tên lửa vũ trụ · Lớp 3 · Bài 16 · Happy STEAM</title>
<template data-slot="header-copy">

      <h1>Xe chở tên lửa vũ trụ</h1>
      <p class="lede pro-only">Lắp xe 32 bước, dùng động cơ đưa tên lửa vũ trụ từ nhà xưởng đến đúng ô bệ phóng. Quan sát màn LED 5×5 và âm thanh khi xe chạy, rồi tính thời gian để xe dừng chính xác.</p>
</template>

    <span class="chip" id="chip-m2" title="Start · Lặp · Mặt cười · Giai điệu A · Nhanh · Chờ 3 giây · Dừng · Mặt buồn · Giai điệu B · Hết lặp"><i>2</i>Đúng 10 khối mẫu</span>
    <span class="chip" id="chip-m3" title="Chỉnh khối Chờ: 3 giây làm xe vượt bệ phóng ở cự ly vừa"><i>3</i>Dừng đúng bệ phóng</span>
    <span class="chip" id="chip-m4" title="Gắn pin mặt trời, ăng-ten, đèn pha kép hoặc tấm chắn trước và chạy thử"><i>4</i>Sáng tạo xe</span>
    <span class="chip pro-only" id="chip-m5" title="Quan sát bệ phóng ở gần, vừa hoặc xa mỗi lượt và chỉnh thời gian"><i>5</i>Cự ly thay đổi</span>
</template>

<template data-slot="victory-copy">

      <p class="code-line">Mã tham chiếu: <code id="verify-code-output">ZM3-16</code></p>
