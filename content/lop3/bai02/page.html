<title>Xe nâng hàng · Lớp 3 · Bài 2 · Happy STEAM</title>
<template data-slot="header-copy">
      <div class="eyebrow">Lớp 3 · Bài 2 · Di chuyển vật thể</div>
      <h1>Di chuyển vật thể – Xe nâng hàng</h1>
      <p class="lede pro-only">Lắp xe nâng 31 bước với M1 đưa xe tiến/lùi, M2 nâng hạ càng và cảm biến siêu âm. Lập trình tiếp cận, đưa càng vào gầm pallet, nâng và lùi về ô tập kết.</p>
</template>

<template data-slot="mission-chips">
    <span class="chip" id="chip-m1" title="Hoàn thành đủ 31 trang lắp ráp trong sách"><i>1</i>Lắp 31 bước</span>
    <span class="chip" id="chip-m2" title="Lắp đúng thứ tự 16 khối của KHGD và chạy hết"><i>2</i>Mẫu 16 khối</span>
    <span class="chip" id="chip-m3" title="Chỉnh Chờ sau M1 tiến vào thành 2 giây"><i>3</i>Nâng pallet về đích</span>
    <span class="chip" id="chip-m4" title="Thử một trong bốn gói càng, chắn lưng, bánh kép hoặc cảnh báo"><i>4</i>Gắn nâng cấp</span>
    <span class="chip pro-only" id="chip-m5" title="Thêm Đợi đường trống ngay trước khi M1 lùi"><i>5</i>Vượt vật cản</span>
</template>

<template data-slot="victory-copy">
      <p>Em đã lắp xe nâng, đưa pallet về ô tập kết và cải tiến mô hình để vận chuyển an toàn.</p>
      <p class="code-line">Mã tham chiếu: <code id="verify-code-output">ZM3-02</code></p>
</template>

<template data-slot="assembly-tab">
      <i>1</i><span><b>Lắp ráp</b><small>31 bước theo sách</small></span>
</template>

<template data-slot="assembly-count">
          <span class="pill" data-k="info"><span>Bước </span><b id="countNow">1</b><span id="countTotal"> / 31</span></span>
</template>

<template data-slot="assembly-canvas">
              <canvas id="view" aria-label="Mô hình xe nâng hàng và pallet 3D: kéo để xoay, cuộn để phóng to"></canvas>
</template>

<template data-slot="assembly-slider">
                <input id="slider" type="range" min="1" max="31" value="1" aria-label="Chọn bước lắp">
</template>

<template data-slot="assembly-meter-step">
          <div class="meter"><dt>Bước</dt><dd><div class="v" id="am-step">1<small>/ 31</small></div><div class="s" id="am-step-s">Động cơ M1 và khung xe</div></dd></div>
</template>

<template data-slot="assembly-meter-done">
          <div class="meter"><dt>Đã lắp xong</dt><dd><div class="v" id="am-done">0<small>/ 31</small></div><div class="bar"><b id="am-done-bar"></b></div></dd></div>
</template>

<template data-slot="book-image">
          <img id="book-img" src="assets/lop3-bai02/step-01.jpg" alt="Bước 1: hình sách lắp xe nâng hàng">
</template>

<template data-slot="book-link">
          <a id="book-pdf" class="link" href="assets/lop3-bai02/step-01.jpg" target="_blank" rel="noopener">Mở hình lớn ↗</a>
</template>

<template data-slot="creative-intro">
          <p class="status-text">Cải tiến xe nâng trong nhà kho: <b>càng nâng rộng</b> giúp đỡ pallet lớn, <b>chắn lưng</b> giữ hàng, <b>bánh sau kép</b> tăng ổn định và <b>đèn/còi lùi</b> cảnh báo người xung quanh. Các phụ kiện trong xưởng là mô phỏng ý tưởng.</p>
</template>

<template data-slot="creative-canvas">
        <div class="canvas-box stage-3d" id="creative-stage" aria-label="Mô hình xe nâng hàng và pallet 3D đang sáng tạo"></div>
</template>

<template data-slot="creative-slot-label">
        <div class="panel-h"><h2>Tự gắn chi tiết</h2><small>Bốn vị trí nâng cấp</small></div>
</template>

<template data-slot="creative-result-label">
        <div class="panel-h"><h2>Xe nâng của em sẽ có</h2></div>
</template>

<template data-slot="sim-upgrade-label">
            <small id="sim-active-upgrade-badge" class="status-tag">Xe nâng cơ bản</small>
</template>

<template data-slot="sim-scene">
          <canvas id="space-scene" aria-label="Nhà kho nhìn ngang có xe nâng, cảm biến siêu âm, pallet và ô tập kết"></canvas>
          <div class="sim-stage" id="sim-stage" aria-label="Xe nâng 3D chạy theo các khối lệnh"></div>
          <p class="scene-idle" id="scene-idle">Nạp 16 khối mẫu trong sách, nhấn Start để xe tiếp cận pallet</p>
</template>

<template data-slot="sim-meters">
        <dl class="meters pro-only">
          <div class="meter"><dt>Tốc độ xe</dt><dd><div class="v" id="m-speed">0<small>cm/giây</small></div><div class="s" id="m-speed-note">M1 · bánh sau</div></dd></div>
          <div class="meter"><dt>Khoảng cách</dt><dd><div class="v" id="m-dist">0<small>cm</small></div><div class="s" id="m-dist-note">Cảm biến siêu âm phía trước</div></dd></div>
          <div class="meter"><dt>Độ nâng</dt><dd><div class="v" id="m-lift">0<small>%</small></div><div class="s" id="m-lift-note">M2 · càng nâng</div></dd></div>
          <div class="meter"><dt>Thời gian</dt><dd><div class="v" id="m-time">0<small>giây</small></div><div class="s" id="m-time-note">Đường lùi</div></dd></div>
        </dl>
</template>

<template data-slot="sim-calculation">
        <div class="panel-h"><h2>Tính toán</h2><small>Quãng đường = tốc độ M1 × thời gian chờ; M2 hạ/nâng bằng cơ cấu 4 khâu</small></div>
        <div class="pad calc">
          <p class="calc-eq" id="calc-eq1"></p>
          <p class="calc-eq" id="calc-eq2"></p>
        </div>
</template>

<template data-slot="sim-hint">
            <p class="hint"><b>Mẫu:</b> 16 khối đúng KHGD (M1 tiến CCW, M2 hạ CCW, M1 tiến CCW, M2 nâng CW, M1 lùi CW). <b>M3:</b> đổi Chờ khi tiến vào pallet từ 1 lên 2 giây. <b>Nâng cao:</b> Đợi đường trống ngay trước khi lùi.</p>
</template>
