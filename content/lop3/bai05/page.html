<title>Xe đổ rác – Hành trình xanh · Lớp 3 · Bài 5 · Happy STEAM</title>
<template data-slot="header-copy">
      <div class="eyebrow">Lớp 3 · Bài 5 · Thu gom và phân loại rác thải</div>
      <h1>Xe đổ rác</h1>
      <p class="lede pro-only">Lắp xe thu gom rác 24 bước, tìm hiểu motor M1 và bánh răng truyền động, lập trình xe chạy nhanh liên tục rồi thử đỗ đúng ô gom rác trên phố.</p>
</template>

<template data-slot="mission-chips">

    <span class="chip" id="chip-m2" title="Start → Repeat Start → High Speed → Repeat End"><i>2</i>4 khối theo mẫu</span>
    <span class="chip" id="chip-m3" title="Bỏ lặp, dùng High Speed → Chờ 3 giây → Dừng"><i>3</i>Đỗ đúng ô gom</span>
    <span class="chip" id="chip-m4" title="Chọn một phụ kiện, gắn lên xe 3D và chạy thử"><i>4</i>Thử gói sáng tạo</span>
    <span class="chip pro-only" id="chip-m5" title="Chuyển sang lượt nặng và chỉnh Chờ thành 2 giây"><i>5</i>Tải nặng đổi quán tính</span>
</template>

<template data-slot="victory-copy">
      <p>Em đã hoàn thành xe đổ rác, lập trình chuyển động và biết cách đỗ đúng vị trí để thu gom an toàn.</p>
      <p class="code-line">Mã tham chiếu: <code id="verify-code-output">ZM3-05</code></p>
</template>

<template data-slot="assembly-tab">
      <i>1</i><span><b>Lắp ráp</b><small>24 bước theo sách</small></span>
</template>

</template>

</template>

<template data-slot="assembly-slider">

</template>

<template data-slot="assembly-meter-step">
          <div class="meter"><dt>Bước</dt><dd><div class="v" id="am-step">1<small>/ 24</small></div><div class="s" id="am-step-s">Lắp khung gầm xe bốn bánh</div></dd></div>
</template>

<template data-slot="assembly-meter-done">
          <div class="meter"><dt>Đã lắp xong</dt><dd><div class="v" id="am-done">0<small>/ 24</small></div><div class="bar"><b id="am-done-bar"></b></div></dd></div>
</template>

<template data-slot="book-image">
          <img id="book-img" src="assets/lop3-bai05/step-01.jpg" alt="Hình bước 1 trong sách hướng dẫn lắp ráp">
</template>

<template data-slot="book-link">
          <a id="book-pdf" class="link" href="assets/lop3-bai05/step-01.jpg" target="_blank" rel="noopener">Mở hình lớn ↗</a>
</template>

<template data-slot="creative-intro">
          <p class="status-text">Gắn <b>thùng ben thủ công</b> để đổ rác tại trạm, <b>tấm gạt</b> hỗ trợ gom rác, <b>nắp thùng</b> hạn chế rơi vãi hoặc <b>vách ngăn</b> tách rác hữu cơ và tái chế. Những bộ phận này chưa có motor riêng; em thao tác bằng tay trên mô hình thật.</p>
</template>

<template data-slot="creative-canvas">
        <div class="canvas-box stage-3d" id="creative-stage" aria-label="Mô hình xe thu gom rác bốn bánh 3D đang sáng tạo"></div>
</template>

<template data-slot="creative-slot-label">
        <div class="panel-h"><h2>Tự gắn chi tiết</h2><small>4 vị trí gắn phụ kiện trên xe</small></div>
</template>

<template data-slot="creative-result-label">
        <div class="panel-h"><h2>Xe thu gom rác của em sẽ có</h2></div>
</template>

<template data-slot="sim-upgrade-label">

</template>

          <div class="sim-stage" id="sim-stage" aria-label="Xe thu gom rác tiến đến ô đỗ theo thời gian chạy động cơ M1"></div>

          <div class="meter"><dt>Đường đã đi</dt><dd><div class="v" id="m-distance">0<small>m</small></div><div class="s" id="m-distance-note">Động cơ M1 kéo bánh sau</div></dd></div>
          <div class="meter"><dt>Tốc độ</dt><dd><div class="v" id="m-speed">0<small>m/s</small></div><div class="s" id="m-speed-note">Chậm / vừa / nhanh</div></dd></div>

          <div class="meter"><dt>Tải rác</dt><dd><div class="v" id="m-load">Nhẹ</div><div class="s" id="m-load-note">Chở đầy trôi phanh xa hơn</div></dd></div>
        </dl>
</template>

<template data-slot="sim-calculation">

        <div class="pad calc">
          <p class="calc-eq" id="calc-eq1"></p>
          <p class="calc-eq" id="calc-eq2"></p>
        </div>
</template>

            <p class="hint"><b>Mẫu:</b> Start → Lặp → High Speed → Hết lặp. <b>Đỗ xe:</b> Start → High Speed → Chờ 3s → Dừng. <b>Nâng cao:</b> chở nặng, giảm thời gian còn 2s.</p>
