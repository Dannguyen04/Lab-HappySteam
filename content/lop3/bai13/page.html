<title>Phi thuyền không gian · Lớp 3 · Bài 13 · Happy STEAM</title>
<template data-slot="header-copy">
      <div class="eyebrow">Lớp 3 · Bài 13 · Phi thuyền không gian</div>
      <h1>Phi thuyền không gian</h1>
      <p class="lede pro-only">Lắp phi thuyền 41 bước, dùng một động cơ M1 tăng tốc qua ba cấp trên đường băng sân bay vũ trụ. Chỉnh thời gian để cất cánh trước hàng rào.</p>
</template>

<template data-slot="mission-chips">
    <span class="chip" id="chip-m1" title="Hoàn thành đủ 41 trang sách hướng dẫn"><i>1</i>Lắp đủ 41 bước</span>
    <span class="chip" id="chip-m2" title="Start · B · Lặp · Chậm ngược · Chờ 3s · Vừa ngược · Chờ 3s · Nhanh ngược · Chờ 3s · Hết lặp"><i>2</i>Đúng 10 khối mẫu</span>
    <span class="chip" id="chip-m3" title="Chỉnh số giây ở khối Chờ để đủ tốc trước hàng rào"><i>3</i>Cất cánh</span>
    <span class="chip" id="chip-m4" title="Gắn cánh phụ, động cơ đẩy, radar hoặc chân đáp rồi thử chạy"><i>4</i>Thử gói sáng tạo</span>
    <span class="chip pro-only" id="chip-m5" title="Mặt Trăng, sao Hỏa, tiểu hành tinh đổi theo lượt; chỉnh lại giây chờ"><i>5</i>Đổi trọng lực</span>
</template>

<template data-slot="victory-copy">
      <p>Em đã lắp phi thuyền, lập trình ba cấp tốc độ và cất cánh an toàn trong sân bay vũ trụ.</p>
      <p class="code-line">Mã tham chiếu: <code id="verify-code-output">ZM3-13</code></p>
</template>

<template data-slot="assembly-tab">
      <i>1</i><span><b>Lắp ráp</b><small>41 bước theo sách</small></span>
</template>

<template data-slot="assembly-count">
          <span class="pill" data-k="info"><span>Bước </span><b id="countNow">1</b><span id="countTotal"> / 41</span></span>
</template>

<template data-slot="assembly-canvas">
              <canvas id="view" aria-label="Mô hình phi thuyền bánh lăn 3D: kéo để xoay, cuộn để phóng to"></canvas>
</template>

<template data-slot="assembly-slider">
                <input id="slider" type="range" min="1" max="41" value="1" aria-label="Chọn bước lắp">
</template>

<template data-slot="assembly-meter-step">
          <div class="meter"><dt>Bước</dt><dd><div class="v" id="am-step">1<small>/ 41</small></div><div class="s" id="am-step-s">Động cơ và hai chốt</div></dd></div>
</template>

<template data-slot="assembly-meter-done">
          <div class="meter"><dt>Đã lắp xong</dt><dd><div class="v" id="am-done">0<small>/ 41</small></div><div class="bar"><b id="am-done-bar"></b></div></dd></div>
</template>

<template data-slot="book-image">
          <img id="book-img" src="assets/lop3-bai13/step-01.jpg" alt="Bước 1: hình sách lắp phi thuyền">
</template>

<template data-slot="book-link">
          <a id="book-pdf" class="link" href="assets/lop3-bai13/step-01.jpg" target="_blank" rel="noopener">Mở hình lớn ↗</a>
</template>

<template data-slot="creative-intro">
          <p class="status-text">Chọn gói sáng tạo cho phi thuyền: <b>cánh phụ thăng bằng</b> nhẹ và tăng gia tốc 2%; <b>cụm động cơ đẩy</b> thêm lực đẩy 8%; <b>ăng-ten radar</b> thêm khối lượng, giảm gia tốc 2%; <b>chân đáp giảm chấn</b> thêm khối lượng, giảm gia tốc 3%. Các mức chỉ là mô phỏng để so sánh.</p>
</template>

<template data-slot="creative-canvas">
        <div class="canvas-box stage-3d" id="creative-stage" aria-label="Mô hình phi thuyền bánh lăn 3D đang sáng tạo"></div>
</template>

<template data-slot="creative-slot-label">
        <div class="panel-h"><h2>Tự gắn chi tiết</h2><small>Bốn vị trí nâng cấp</small></div>
</template>

<template data-slot="creative-result-label">
        <div class="panel-h"><h2>Thân phi thuyền của em sẽ có</h2></div>
</template>

<template data-slot="sim-upgrade-label">
            <small id="sim-active-upgrade-badge" class="status-tag">Phi thuyền cơ bản</small>
</template>

<template data-slot="sim-scene">
          <canvas id="space-scene" aria-label="Sa bàn nhìn ngang đường băng sân bay vũ trụ, phi thuyền tăng tốc, cất cánh hoặc phanh trước hàng rào"></canvas>
          <div class="sim-stage" id="sim-stage" aria-label="Phi thuyền 3D tăng tốc trên đường băng"></div>
          <p class="scene-idle" id="scene-idle">Xếp chương trình mẫu rồi nhấn Start để thử đường băng</p>
</template>

<template data-slot="sim-meters">
        <dl class="meters pro-only">
          <div class="meter"><dt>Vận tốc</dt><dd><div class="v" id="m-speed">0<small>cm/giây</small></div><div class="s" id="m-speed-note">Cần đủ tốc để cất cánh</div></dd></div>
          <div class="meter"><dt>Đã chạy</dt><dd><div class="v" id="m-dist">0<small>cm</small></div><div class="s" id="m-dist-note">Hàng rào ở cuối đường băng</div></dd></div>
          <div class="meter"><dt>Trọng lực</dt><dd><div class="v" id="m-gravity">0</div><div class="s" id="m-gravity-note">Đổi mỗi lượt Nâng cao</div></dd></div>
          <div class="meter"><dt>Thời gian</dt><dd><div class="v" id="m-time">0<small>giây</small></div><div class="s" id="m-time-note">Một vòng chương trình</div></dd></div>
        </dl>
</template>

<template data-slot="sim-calculation">
        <div class="panel-h"><h2>Tính toán</h2><small>Vận tốc tăng nhờ gia tốc · cần đủ tốc trước mốc 41 cm</small></div>
        <div class="pad calc">
          <p class="calc-eq" id="calc-eq1"></p>
          <p class="calc-eq" id="calc-eq2"></p>
        </div>
</template>

<template data-slot="sim-hint">
            <p class="hint"><b>M2:</b> chạy hết một vòng 10 khối theo ảnh. <b>M3:</b> chỉnh ít nhất một khối Chờ, ví dụ cấp Nhanh từ 3 lên 4 giây. <b>Nâng cao:</b> trọng lực đổi sau mỗi lượt, hãy thử lại thời gian.</p>
</template>
