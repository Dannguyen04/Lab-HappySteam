<template data-slot="sim-hint">
            <p class="hint"><b>NV2</b> ghép đúng chương trình trong sách và chạy hết một vòng lặp. <b>NV3</b> khi vệ tinh tiến gần thiên thạch (60°–110°), dùng <b>Motor This Way</b> để đổi chiều, hoặc <b>Dừng</b> trước 110°. Chú ý: khối <b>Melody B</b> kéo dài 1 giây mà motor vẫn quay, nên đặt <b>Dừng</b> ngay sau Melody B ở tốc độ chậm, đừng chen khối khác ở giữa. Khối <b>Chờ vật cản</b> cần gói Cảm biến ở chặng Sáng tạo.</p>
