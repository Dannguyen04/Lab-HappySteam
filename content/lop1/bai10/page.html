<title>Cối xoay gió · Lớp 1 · Bài 10 · Happy STEAM</title>
<template data-slot="header-copy">
      <div class="eyebrow">Lớp 1 · Bài 10 · Bạn gió tinh nghịch, gió ở đâu?</div>
      <h1>Cối xoay gió</h1>
      <p class="lede pro-only">Lắp cối xoay gió theo 15 bước của sách, gắn thêm chi tiết sáng tạo, rồi lập trình cho nút bấm đổi tốc độ cánh quạt: chậm, vừa, nhanh, dừng – biến gió thành điện thắp sáng ngôi nhà.</p>
</template>

<template data-slot="mission-chips">
    <span class="chip" id="chip-m1" title="Bấm “Đã lắp xong bước này” ở cả 15 bước"><i>1</i>Lắp xong 15 bước</span>
    <span class="chip" id="chip-m2" title="Start · Repeat · (Waiting for Pressed · Low Speed · Waiting for Pressed · Medium Speed · Waiting for Pressed · High Speed · Waiting for Pressed · Stop) · Repeat End"><i>2</i>Lập trình theo mẫu</span>
    <span class="chip" id="chip-m3" title="Cho cánh quạt quay đến khi pin đầy, ngôi nhà sáng đèn"><i>3</i>Sạc đầy pin</span>
    <span class="chip" id="chip-m4" title="Gắn gói nâng cấp ở chặng Sáng tạo, đưa vào sa bàn và cho động cơ chạy"><i>4</i>Thử nâng cấp sáng tạo</span>
    <span class="chip pro-only" id="chip-m5" title="Nâng cao: thời tiết đổi, khi bão phải cho cánh quạt dừng rồi sạc đầy pin"><i>5</i>Vượt qua cơn bão</span>
</template>

<template data-slot="victory-copy">
      <p>Em đã lắp xong cối xoay gió, lập trình đúng theo sách, sạc đầy pin cho ngôi nhà và thử nâng cấp sáng tạo của mình.</p>
      <p class="code-line">Mã tham chiếu: <code id="verify-code-output">ZM10</code></p>
</template>

<template data-slot="assembly-tab">
      <i>1</i><span><b>Lắp ráp</b><small>15 bước theo sách</small></span>
</template>

<template data-slot="assembly-count">
          <span class="pill" data-k="info"><span>Bước </span><b id="countNow">1</b><span id="countTotal"> / 15</span></span>
</template>

<template data-slot="assembly-canvas">
              <canvas id="view" aria-label="Mô hình cối xoay gió 3D: kéo để xoay, cuộn để phóng to"></canvas>
</template>

<template data-slot="assembly-slider">
                <input id="slider" type="range" min="1" max="15" value="1" aria-label="Chọn bước lắp">
</template>

<template data-slot="assembly-meter-step">
          <div class="meter"><dt>Bước</dt><dd><div class="v" id="am-step">1<small>/ 15</small></div><div class="s" id="am-step-s">Cối xoay gió</div></dd></div>
</template>

<template data-slot="assembly-meter-done">
          <div class="meter"><dt>Đã lắp xong</dt><dd><div class="v" id="am-done">0<small>/ 15</small></div><div class="bar"><b id="am-done-bar"></b></div></dd></div>
</template>

<template data-slot="book-image">
          <img id="book-img" src="assets/bai10/step-01.jpg" alt="Hình bước 1 trong sách hướng dẫn lắp ráp">
</template>

<template data-slot="book-link">
          <a id="book-pdf" class="link" href="assets/bai10/step-01.jpg" target="_blank" rel="noopener">Mở hình lớn ↗</a>
</template>

<template data-slot="creative-intro">
          <p class="status-text">Gió là năng lượng sạch. Hãy làm cối xoay gió <b>quay nhanh hơn</b> để <b>sinh nhiều điện hơn</b>, và đẹp hơn. Chọn gói gợi ý hoặc tự gắn chi tiết, chi tiết mới sẽ rơi vào mô hình.</p>
</template>

<template data-slot="creative-canvas">
        <div class="canvas-box stage-3d" id="creative-stage" aria-label="Mô hình cối xoay gió 3D đang sáng tạo"></div>
</template>

<template data-slot="creative-slot-label">
        <div class="panel-h"><h2>Tự gắn chi tiết</h2><small>4 vị trí trên cối xoay gió</small></div>
</template>

<template data-slot="creative-result-label">
        <div class="panel-h"><h2>Cối xoay gió của em sẽ có</h2></div>
</template>

<template data-slot="sim-upgrade-label">
            <small id="sim-active-upgrade-badge" class="status-tag">Cối xoay gió cơ bản</small>
</template>

<template data-slot="sim-scene">
          <canvas id="space-scene" aria-label="Cảnh cánh đồng gió: cối xoay gió sạc pin thắp đèn ngôi nhà"></canvas>
          <div class="sim-stage" id="sim-stage" aria-label="Cối xoay gió 3D quay theo chương trình"></div>
          <p class="scene-idle" id="scene-idle">Chạm khối <b>Start</b> màu vàng hoặc nút <b>▶</b>, rồi nhấn <b>nút đỏ</b> để cánh quạt quay</p>
          <button type="button" class="hand-btn press-btn" id="scene-press" title="Nhấn nút đỏ (cảm biến chạm) – hoặc phím cách" aria-label="Nhấn nút đỏ"><span aria-hidden="true"></span></button>
</template>

<template data-slot="sim-meters">
        <dl class="meters pro-only">
          <div class="meter"><dt>Cánh quạt</dt><dd><div class="v" id="m-rpm">0<small>vòng/phút</small></div><div class="s" id="m-rpm-note">Đang dừng</div></dd></div>
          <div class="meter"><dt>Pin</dt><dd><div class="v" id="m-battery">0<small>%</small></div><div class="s">ngôi nhà</div></dd></div>
          <div class="meter"><dt>Sạc</dt><dd><div class="v" id="m-rate">0<small>%/giây</small></div><div class="s">theo tốc độ và gió</div></dd></div>
          <div class="meter"><dt>Thời tiết</dt><dd><div class="v" id="m-weather">Gió nhẹ</div><div class="s" id="m-weather-note">Ổn định</div></dd></div>
        </dl>
</template>

<template data-slot="sim-calculation">
        <div class="panel-h"><h2>Tính toán</h2><small>Quay nhanh hơn → nhiều điện hơn</small></div>
        <div class="pad calc">
          <p class="calc-eq" id="calc-eq1"></p>
          <p class="calc-eq" id="calc-eq2"></p>
        </div>
</template>

<template data-slot="sim-hint">
            <p class="hint"><b>NV2:</b> Ghép đúng chương trình mẫu trong sách, chạy rồi nhấn nút đỏ 4 lần (chậm → vừa → nhanh → dừng). <b>NV3:</b> Cho cánh quạt quay đến khi pin đầy 100%: quay nhanh sạc nhanh nhất. Nút đỏ trên cảnh hoặc phím Cách (Space) là nhấn cảm biến chạm.</p>
</template>
