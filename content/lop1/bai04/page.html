<title>Máy khoan cảm biến chạm · Lớp 1 · Bài 4 · Happy STEAM</title>
<template data-slot="header-copy">
      <div class="eyebrow">Lớp 1 · Bài 4 · Cảm biến của robot</div>
      <h1>Cảm biến của robot</h1>
      <p class="lede pro-only">Lắp máy khoan 23 bước. Nhấn giữ cò đỏ để khoan, thả cò để dừng. Thử chọn tốc độ phù hợp và sáng tạo công cụ treo tranh.</p>
</template>

<template data-slot="mission-chips">
    <span class="chip" id="chip-m1" title="Bấm “Đã lắp xong bước này” ở cả 23 bước"><i>1</i>Lắp xong 23 bước</span>
    <span class="chip" id="chip-m2" title="Ghép 7 khối theo mẫu rồi nhấn giữ và nhả cò"><i>2</i>Cò nhấn – nhả</span>
    <span class="chip" id="chip-m3" title="Đổi khối Quay nhanh thành Quay chậm, giữ đủ lâu rồi thả"><i>3</i>Khoan gạch không nứt</span>
    <span class="chip" id="chip-m4" title="Gắn gói nâng cấp ở chặng Sáng tạo, đưa vào sa bàn và cho động cơ chạy"><i>4</i>Thử nâng cấp sáng tạo</span>
    <span class="chip pro-only" id="chip-m5" title="Nâng cao: khoan đúng lần lượt gạch men, gỗ và thạch cao"><i>5</i>Thử ba chất liệu</span>
</template>

<template data-slot="victory-copy">
      <p>Em đã lắp máy khoan, làm chủ cảm biến chạm và thử nâng cấp để treo tranh!</p>
      <p class="code-line">Mã tham chiếu: <code id="verify-code-output">ZM4</code></p>
</template>

<template data-slot="assembly-tab">
      <i>1</i><span><b>Lắp ráp</b><small>23 bước theo sách</small></span>
</template>

<template data-slot="assembly-count">
          <span class="pill" data-k="info"><span>Bước </span><b id="countNow">1</b><span id="countTotal"> / 23</span></span>
</template>

<template data-slot="assembly-canvas">
              <canvas id="view" aria-label="Mô hình máy khoan thông minh 3D: kéo để xoay, cuộn để phóng to"></canvas>
</template>

<template data-slot="assembly-slider">
                <input id="slider" type="range" min="1" max="23" value="1" aria-label="Chọn bước lắp">
</template>

<template data-slot="assembly-meter-step">
          <div class="meter"><dt>Bước</dt><dd><div class="v" id="am-step">1<small>/ 23</small></div><div class="s" id="am-step-s">Động cơ và hai chốt đầu khoan</div></dd></div>
</template>

<template data-slot="assembly-meter-done">
          <div class="meter"><dt>Đã lắp xong</dt><dd><div class="v" id="am-done">0<small>/ 23</small></div><div class="bar"><b id="am-done-bar"></b></div></dd></div>
</template>

<template data-slot="book-image">
          <img id="book-img" src="assets/lop1-bai04/step-01.jpg" alt="Hình bước 1 trong sách hướng dẫn lắp ráp">
</template>

<template data-slot="book-link">
          <a id="book-pdf" class="link" href="assets/lop1-bai04/step-01.jpg" target="_blank" rel="noopener">Mở hình lớn ↗</a>
</template>

<template data-slot="creative-intro">
          <p class="status-text">Máy khoan cần <b>cò dễ nhấn</b>, <b>tay cầm vững</b>, <b>thước đo độ sâu</b> hoặc <b>tấm chắn phoi</b>. Chọn một món để gắn lên mô hình rồi thử khoan.</p>
</template>

<template data-slot="creative-canvas">
        <div class="canvas-box stage-3d" id="creative-stage" aria-label="Mô hình máy khoan thông minh 3D đang sáng tạo"></div>
</template>

<template data-slot="creative-slot-label">
        <div class="panel-h"><h2>Tự gắn chi tiết</h2><small>4 vị trí trên máy khoan</small></div>
</template>

<template data-slot="creative-result-label">
        <div class="panel-h"><h2>Máy khoan cải tiến của em</h2></div>
</template>

<template data-slot="sim-upgrade-label">
            <small id="sim-active-upgrade-badge" class="status-tag">Máy khoan cơ bản</small>
</template>

<template data-slot="sim-scene">
          <canvas id="space-scene" aria-label="Phòng khách nhìn ngang: máy khoan hướng vào bức tường để tạo lỗ treo tranh"></canvas>
          <div class="sim-stage" id="sim-stage" aria-label="Máy khoan 3D dùng cảm biến chạm"></div>
          <p class="scene-idle" id="scene-idle">Nhấn ▶, sau đó giữ 🔴 để khoan. Thả tay để dừng.</p>
          <button type="button" class="hand-btn press-btn" id="scene-press" title="Nhấn nút đỏ (cảm biến chạm) – hoặc phím cách" aria-label="Nhấn nút đỏ"><span aria-hidden="true"></span></button>
</template>

<template data-slot="sim-meters">
        <dl class="meters pro-only">
          <div class="meter"><dt>Độ sâu</dt><dd><div class="v" id="m-depth">0<small>mm</small></div><div class="s" id="m-depth-note">Đích 8–11 mm</div></dd></div>
          <div class="meter"><dt>Thời gian</dt><dd><div class="v" id="m-seconds">0<small>giây</small></div><div class="s" id="m-seconds-note">Giữ cò để khoan</div></dd></div>
          <div class="meter"><dt>Tốc độ</dt><dd><div class="v" id="m-drill-speed">0<small>mức</small></div><div class="s" id="m-drill-speed-note">Chậm / Vừa / Nhanh</div></dd></div>
        </dl>
</template>

<template data-slot="sim-calculation">
        <div class="pro-only">
        <div class="panel-h"><h2>Tính toán</h2><small>Độ sâu phụ thuộc tốc độ, thời gian và bề mặt tường.</small></div>
        <div class="pad calc">
          <p class="calc-eq" id="calc-eq1"></p>
          <p class="calc-eq" id="calc-eq2"></p>
        </div>
        </div>
</template>

<template data-slot="sim-hint">
            <p class="hint"><b>Mẫu:</b> Chờ nhấn → Quay nhanh → Chờ nhả → Dừng. <b>Thử thách:</b> chọn Quay chậm khi khoan gạch men. Giữ tới vạch xanh rồi nhả. <b>Nâng cao:</b> thử gỗ và thạch cao với tốc độ khác.</p>
</template>
