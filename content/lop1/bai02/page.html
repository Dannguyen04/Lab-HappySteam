<title>Xe đua Động cơ · Lớp 1 · Bài 2 · Happy STEAM</title>
<template data-slot="header-copy">
      <div class="eyebrow">Lớp 1 · Bài 2 · Động cơ</div>
      <h1>Xe đua Động cơ</h1>
      <p class="lede pro-only">Lắp xe đua một động cơ theo 14 bước của sách, gắn thêm chi tiết sáng tạo, rồi lập trình cho xe leo dốc, qua vạch đích và đỗ gọn vào ô đỗ.</p>
</template>

<template data-slot="mission-chips">
    <span class="chip" id="chip-m1" title="Bấm “Đã lắp xong bước này” ở cả 14 bước"><i>1</i>Lắp xong 14 bước</span>
    <span class="chip" id="chip-m2" title="Start · Quay nhanh · Chờ 3s · Dừng"><i>2</i>Lập trình theo mẫu</span>
    <span class="chip" id="chip-m3" title="Qua vạch đích rồi dừng hẳn trong ô đỗ, không đâm tường lốp"><i>3</i>Đỗ xe vào ô đỗ</span>
    <span class="chip" id="chip-m4" title="Gắn gói nâng cấp ở chặng Sáng tạo, đưa vào sa bàn và cho động cơ chạy"><i>4</i>Thử nâng cấp sáng tạo</span>
    <span class="chip pro-only" id="chip-m5" title="Nâng cao: dốc lên rồi dốc xuống, nối khối Quay nhanh và Quay chậm để đỗ vào ô"><i>5</i>Vượt dốc lên xuống</span>
</template>

<template data-slot="victory-copy">
      <p>Em đã lắp xong xe đua, lập trình đúng theo sách, đỗ xe vào ô đỗ và thử nâng cấp sáng tạo của mình.</p>
      <p class="code-line">Mã tham chiếu: <code id="verify-code-output">ZM2</code></p>
</template>

<template data-slot="assembly-tab">
      <i>1</i><span><b>Lắp ráp</b><small>14 bước theo sách</small></span>
</template>

<template data-slot="assembly-count">
          <span class="pill" data-k="info"><span>Bước </span><b id="countNow">1</b><span id="countTotal"> / 14</span></span>
</template>

<template data-slot="assembly-canvas">
              <canvas id="view" aria-label="Mô hình xe đua 3D: kéo để xoay, cuộn để phóng to"></canvas>
</template>

<template data-slot="assembly-slider">
                <input id="slider" type="range" min="1" max="14" value="1" aria-label="Chọn bước lắp">
</template>

<template data-slot="assembly-meter-step">
          <div class="meter"><dt>Bước</dt><dd><div class="v" id="am-step">1<small>/ 14</small></div><div class="s" id="am-step-s">Thân xe đua</div></dd></div>
</template>

<template data-slot="assembly-meter-done">
          <div class="meter"><dt>Đã lắp xong</dt><dd><div class="v" id="am-done">0<small>/ 14</small></div><div class="bar"><b id="am-done-bar"></b></div></dd></div>
</template>

<template data-slot="book-image">
          <img id="book-img" src="assets/bai02/step-01.png" alt="Hình bước 1 trong sách hướng dẫn lắp ráp">
</template>

<template data-slot="book-link">
          <a id="book-pdf" class="link" href="assets/bai02/step-01.png" target="_blank" rel="noopener">Mở hình lớn ↗</a>
</template>

<template data-slot="creative-intro">
          <p class="status-text">Xe đua sắp vào đường đua có dốc. Hãy làm xe <b>chạy nhanh hơn</b> và <b>leo dốc khỏe hơn</b>. Chọn gói gợi ý hoặc tự gắn chi tiết, chi tiết mới sẽ rơi vào mô hình.</p>
</template>

<template data-slot="creative-canvas">
        <div class="canvas-box stage-3d" id="creative-stage" aria-label="Mô hình xe đua 3D đang sáng tạo"></div>
</template>

<template data-slot="creative-slot-label">
        <div class="panel-h"><h2>Tự gắn chi tiết</h2><small>4 vị trí trên xe</small></div>
</template>

<template data-slot="creative-result-label">
        <div class="panel-h"><h2>Xe của em sẽ có</h2></div>
</template>

<template data-slot="sim-upgrade-label">
            <small id="sim-active-upgrade-badge" class="status-tag">Xe cơ bản</small>
</template>

<template data-slot="sim-scene">
          <canvas id="space-scene" aria-label="Đường đua có dốc: xe chạy theo chương trình, qua vạch đích và đỗ vào ô đỗ"></canvas>
          <div class="sim-stage" id="sim-stage" aria-label="Xe đua 3D chạy theo chương trình"></div>
          <p class="scene-idle" id="scene-idle">Chạm khối <b>Start</b> màu vàng hoặc nút <b>▶</b> để xe xuất phát</p>
</template>

<template data-slot="sim-meters">
        <dl class="meters pro-only">
          <div class="meter"><dt>Tốc độ</dt><dd><div class="v" id="m-speed">0<small>cm/giây</small></div><div class="s" id="m-speed-note">Mức 8/8</div></dd></div>
          <div class="meter"><dt>Đã đi</dt><dd><div class="v" id="m-dist">0<small>cm</small></div><div class="s">tính từ vạch xuất phát</div></dd></div>
          <div class="meter"><dt>Đoạn đường</dt><dd><div class="v" id="m-section">Phẳng</div><div class="s">xe đang chạy trên</div></dd></div>
          <div class="meter"><dt>Ô đỗ</dt><dd><div class="v" id="m-park">160–180<small>cm</small></div><div class="s" id="m-park-note">Vạch đích 150 cm</div></dd></div>
        </dl>
</template>

<template data-slot="sim-calculation">
        <div class="panel-h"><h2>Tính toán</h2><small>Tốc độ × thời gian = quãng đường</small></div>
        <div class="pad calc">
          <p class="calc-eq" id="calc-eq1"></p>
          <p class="calc-eq" id="calc-eq2"></p>
        </div>
</template>

<template data-slot="sim-hint">
            <p class="hint"><b>NV2</b> ghép đúng chương trình trong phiếu học tập rồi cho xe chạy tới cuối. <b>NV3</b> cho xe qua vạch đích rồi dừng hẳn trong ô đỗ vàng, không đâm tường lốp: lên dốc xe chậm lại, nên hãy thử đổi số giây chờ. Mức 8 đi ≈ 39 cm mỗi giây trên đường phẳng, mức 4 ≈ 20 cm mỗi giây.</p>
</template>
