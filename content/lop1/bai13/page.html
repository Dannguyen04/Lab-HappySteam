            <p class="hint"><b>NV2</b> ghép đúng chương trình mẫu (có khối Lặp). Cảm biến thấy đống tuyết trong tầm là xe tự chạy, hoặc bấm ✋ đưa tay trước cảm biến. <b>NV3</b> đẩy sạch mọi đống tuyết mà không đụng tường: tuyết dày, chạy dưới mức 5 sẽ kẹt nếu chưa có lưỡi gạt. Mức 8 đi ≈ 39 cm mỗi giây, mức 4 ≈ 20 cm mỗi giây.</p>
