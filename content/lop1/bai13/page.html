<template data-slot="sim-hint">
            <p class="hint"><b>NV2</b> ghép mẫu 10 khối: Chờ vật cản → Tiến thẳng → Chờ 1 giây → Chờ vật cản → Dừng → Rẽ trái → Chờ 0,2 giây; đặt trong Lặp. <b>NV3</b> dọn hết các đống tuyết rải lệch nhau. Cảm biến nhìn theo đầu xe; bấm ✋ để đưa tay ra trước cảm biến nếu xe đang chờ. <b>Nâng cao</b>: thử đổi Chờ 1 giây thành 2 giây để dọn 5 đống trong không quá 4 lượt tiến.</p>
