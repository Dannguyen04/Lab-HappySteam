<!doctype html>
<html lang="vi" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ebeff2">
  <title>Phiếu mời phụ huynh in A4 (S-09) · Lớp 1A2 · Happy STEAM Lab</title>
  <link rel="stylesheet" href="../css/lab.css">
  <link rel="stylesheet" href="phu-huynh.css">
</head>
<body>

  <!-- Dải nhỏ cố định theo quy chuẩn phiếu 73 (ẩn khi in A4) -->
  <header class="mock-banner no-print" role="banner">
    <a class="mock-banner-back" href="index.html">← Danh sách màn hình</a>
    <span class="mock-banner-tag">DỮ LIỆU MẪU – chưa lưu thật</span>
  </header>

  <main class="pm-workspace">

    <!-- Thanh công cụ giáo viên trên màn hình (ẩn khi in A4) -->
    <section class="pm-toolbar no-print" aria-label="Điều khiển in phiếu mời phụ huynh">
      <div>
        <div class="ph-brand-eyebrow">Màn hình S-09 · Giáo viên chuẩn bị lớp (F-01.4)</div>
        <h1 class="ph-brand-title" style="font-size:22px; margin-top:2px;">Phiếu mời phụ huynh in A4 · Lớp 1A2 (28 học sinh)</h1>
        <p class="ph-card-sub" id="pm-count-summary" style="margin-top:4px;">
          Hiển thị 28/28 phiếu · Mỗi em một ô cắt có mã mời 8 ký tự và ô đặt QR
        </p>
      </div>

      <div class="pm-toolbar-group">
        <input id="pm-search-input" class="pm-search" type="search" placeholder="Tìm tên em, con vật, mã..." aria-label="Tìm học sinh">
        <select id="pm-filter-select" class="pm-search" style="width:auto;" aria-label="Lọc trạng thái phiếu">
          <option value="all">Tất cả 28 học sinh</option>
          <option value="linked">Đã có phụ huynh liên kết</option>
          <option value="unlinked">Chưa liên kết phụ huynh</option>
          <option value="no-consent">Chưa có đồng ý dữ liệu (GD-14)</option>
          <option value="revoked">Mã đã thu hồi (BR-PH-01)</option>
        </select>
        <a class="ph-btn" href="phu-huynh.html">
          Mở màn Phụ huynh (S-10/S-11) →
        </a>
        <button type="button" class="ph-btn" id="pm-btn-reset">
          Khôi phục mẫu
        </button>
        <button type="button" class="ph-btn ph-btn-primary" id="pm-btn-print">
          In phiếu A4 (28 em)
        </button>
      </div>
    </section>

    <!-- Thông báo phản hồi khi giáo viên đổi mã hoặc thu hồi mã trên màn hình -->
    <div class="ph-toast no-print" id="pm-toast" role="status" aria-live="polite" hidden style="max-width:820px; width:100%; margin:0 auto;">
      <span id="pm-toast-text"></span>
      <button type="button" class="ph-toast-close" id="pm-toast-close" aria-label="Đóng thông báo">×</button>
    </div>

    <!-- Danh sách các tờ A4 (mỗi tờ 8 ô cắt = 2 cột × 4 hàng, tổng 4 tờ A4 cho 28 em) -->
    <div class="pm-sheets-container" id="pm-sheets-root"></div>

  </main>

  <script src="phu-huynh.js"></script>
</body>
</html>
