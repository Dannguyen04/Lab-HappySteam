<!doctype html>
<html lang="vi" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Phòng Lab ZMrobo ảo · Happy STEAM</title>
  <link rel="stylesheet" href="css/lab.css">
</head>
<body>
<div class="wrap home">

  <!-- ===== Đầu trang ===== -->
  <header class="top">
    <div>
      <div class="eyebrow">Happy STEAM · Phòng Lab ZMrobo ảo</div>
      <h1>Chọn bài học</h1>
      <p class="lede">Chọn lớp, học kì rồi chạm vào bài hôm nay để lắp mô hình 3D, sáng tạo và lập trình robot.</p>
    </div>
    <div class="tools-top">
      <button type="button" class="iconbtn" id="btn-toggle-theme">Giao diện tối</button>
    </div>
  </header>

  <!-- ===== Chọn lớp và học kì ===== -->
  <nav class="home-pick" aria-label="Chọn lớp và học kì">
    <div class="grade-tabs" role="tablist" aria-label="Lớp" id="grade-tabs"></div>
    <div class="term-tabs" role="tablist" aria-label="Học kì" id="term-tabs">
      <button type="button" role="tab" data-term="1">Học kì I</button>
      <button type="button" role="tab" data-term="2">Học kì II</button>
    </div>
  </nav>

  <!-- ===== Danh sách bài ===== -->
  <section aria-live="polite">
    <p class="home-count" id="home-count"></p>
    <div class="lesson-grid" id="lesson-grid"></div>
  </section>

  <footer class="home-foot">Tài liệu theo khung chương trình AI Robotics tiểu học · Bộ ZMrobo Alpha 330</footer>
</div>

<script src="js/catalog.js"></script>
<script src="js/home.js"></script>
</body>
</html>
